repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
