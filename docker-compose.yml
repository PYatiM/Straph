# Local development stack. Copy .env.example to .env and set real values first.
# Ports are bound to loopback only; secrets come from the environment, never from this file.
services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18.0-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$(echo $$NEO4J_AUTH | cut -d/ -f2-)\" 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  target-app:
    build:
      context: .
      dockerfile: services/evaluation/target_app/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      ALLOW_SKIP_PAYMENT: ${ALLOW_SKIP_PAYMENT:-false}
      ALLOW_POST_SHIP_ADDRESS_EDIT: ${ALLOW_POST_SHIP_ADDRESS_EDIT:-false}
      ALLOW_DOUBLE_REFUND: ${ALLOW_DOUBLE_REFUND:-false}
      ALLOW_BOLA_CANCEL: ${ALLOW_BOLA_CANCEL:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - kafka
      - redis
      - target-app
    environment:
      TARGET_APP_URL: http://target-app:8001
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ALERTS_DB_PATH: /data/alerts.db
    volumes:
      - alerts-data:/data
    restart: unless-stopped

  ranker:
    build:
      context: .
      dockerfile: services/ranker/Dockerfile
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERTS_DB_PATH: /data/alerts.db
    volumes:
      - alerts-data:/data
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
  neo4j-data:
  alerts-data:
