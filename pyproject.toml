[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "straph"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4", "confluent-kafka>=2", "pydantic>=2", "pydantic-settings>=2"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools]
packages = []
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
